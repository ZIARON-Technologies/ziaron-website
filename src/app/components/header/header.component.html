<header
  class="app-header sticky top-0 z-30 flex h-[68px] w-full flex-shrink-0 items-center justify-between gap-6 border-b border-line bg-bg px-[22px] sm:h-[84px] sm:px-11 lg:h-[92px] lg:px-[72px]"
  [class.app-header--scrolled]="scrolled()"
>
  <div class="flex items-center gap-3.5 sm:gap-7">
    <a href="/" class="block h-[29px] w-28 overflow-hidden rounded-sm outline-none focus-visible:ring-2 focus-visible:ring-accent sm:h-[34px] sm:w-[132px] lg:h-[41px] lg:w-[152px]" aria-label="ZIARON Technologies — inicio">
      <!-- El SVG del wordmark (900×420) tiene espacio en blanco alrededor del
           texto — por eso NO se puede escalar con `h-full w-auto` (eso
           encoge todo el wordmark, incluida "TECHNOLOGIES", hasta que no
           entra en el contenedor). La técnica correcta (igual que el
           handoff original) es renderizarlo a un ancho fijo mayor que el
           contenedor y desplazarlo con márgenes negativos para recortar
           justo la ventana donde cae el texto real — el `overflow-hidden`
           del <a> recorta el resto. Valores exactos por breakpoint, tomados
           del handoff de Claude Design. -->
      <img
        [src]="wordmarkSrc()"
        alt="ZIARON Technologies"
        class="block w-[142px] max-w-none -ml-[17px] -mt-[14px] sm:w-[168px] sm:-ml-[21px] sm:-mt-[17px] lg:w-[193px] lg:-ml-[24px] lg:-mt-[19px]"
      />
    </a>

    <!-- MISIÓN, VALORES y CONTACTO llevan a secciones reales (con id propio y
         texto visible) — ver MissionComponent/ValuesComponent/ContactComponent
         en pages/home. El contenido de Misión y Contacto sigue siendo texto
         genérico/placeholder a pedido explícito del usuario (se corrige más
         adelante); Valores ya usa datos reales (PRINCIPLES). `href="/id"`
         (ruta "limpia", sin "#") a pedido explícito del usuario — el click
         se intercepta en `onNavClick()` para hacer scroll suave Y actualizar
         la URL con `history.pushState` (ver header.component.ts), ya que
         esta SPA no tiene Angular Router (una sola página, ver CLAUDE.md). -->
    <nav class="hidden items-center gap-5 sm:flex" aria-label="Secciones de la página">
      <a
        href="/nosotros"
        (click)="onNavClick($event, 'nosotros')"
        class="nav-link rounded-sm font-mono text-[11.5px] tracking-[0.1em] text-accent-text no-underline outline-none transition-colors hover:text-accent focus-visible:ring-2 focus-visible:ring-accent"
        [class.nav-link--active]="activeSection() === 'nosotros'"
      >
        NOSOTROS
      </a>
      <a
        href="/mision"
        (click)="onNavClick($event, 'mision')"
        class="nav-link hidden rounded-sm font-mono text-[11.5px] tracking-[0.1em] text-accent-text no-underline outline-none transition-colors hover:text-accent focus-visible:ring-2 focus-visible:ring-accent lg:inline"
        [class.nav-link--active]="activeSection() === 'mision'"
      >
        MISIÓN
      </a>
      <a
        href="/valores"
        (click)="onNavClick($event, 'valores')"
        class="nav-link hidden rounded-sm font-mono text-[11.5px] tracking-[0.1em] text-accent-text no-underline outline-none transition-colors hover:text-accent focus-visible:ring-2 focus-visible:ring-accent lg:inline"
        [class.nav-link--active]="activeSection() === 'valores'"
      >
        VALORES
      </a>
      <a
        href="/ecosistema"
        (click)="onNavClick($event, 'ecosistema')"
        class="nav-link rounded-sm font-mono text-[11.5px] tracking-[0.1em] text-accent-text no-underline outline-none transition-colors hover:text-accent focus-visible:ring-2 focus-visible:ring-accent"
        [class.nav-link--active]="activeSection() === 'ecosistema'"
      >
        ECOSISTEMA
      </a>
      <a
        href="/contacto"
        (click)="onNavClick($event, 'contacto')"
        class="nav-link hidden rounded-sm font-mono text-[11.5px] tracking-[0.1em] text-accent-text no-underline outline-none transition-colors hover:text-accent focus-visible:ring-2 focus-visible:ring-accent lg:inline"
        [class.nav-link--active]="activeSection() === 'contacto'"
      >
        CONTACTO
      </a>
    </nav>
  </div>

  <div class="flex items-center gap-3 sm:gap-[18px]">
    <div
      class="hidden items-center gap-2 rounded-full border border-accent-border bg-accent-bg py-1.5 pl-2.5 pr-3.5 sm:flex"
    >
      <span
        class="block h-1.5 w-1.5 rounded-full bg-accent-text"
        style="box-shadow: 0 0 0 3px var(--accent-bg)"
      ></span>
      <span class="font-mono text-[11px] font-medium tracking-[0.08em] text-accent-text">EN CONSTRUCCIÓN</span>
    </div>

    <app-theme-toggle />
  </div>
</header>
