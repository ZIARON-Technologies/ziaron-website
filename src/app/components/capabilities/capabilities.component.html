<section id="ecosistema" class="flex w-full scroll-mt-[88px] sm:scroll-mt-[104px] lg:scroll-mt-[112px] flex-col gap-[14px] sm:gap-[26px]">
  <div appReveal class="reveal-delay-1 flex items-baseline justify-between gap-4 border-b border-line pb-[14px] sm:pb-[18px]">
    <h2 class="font-display text-[22px] font-medium tracking-[-0.015em] sm:text-2xl">Qué hacemos</h2>
    <span class="font-mono text-[9.5px] tracking-[0.14em] text-text-dim sm:text-[11px]">04 LÍNEAS DE TRABAJO</span>
  </div>

  <div class="grid grid-cols-1 gap-3.5 sm:grid-cols-2 sm:gap-5 lg:grid-cols-4">
    @for (cap of capabilities; track cap.title; let i = $index) {
      <article
        appReveal
        class="flex flex-col gap-3 rounded-[14px] border border-border bg-bg-elevated p-5 transition-colors hover:border-accent-border sm:p-6"
        [class.reveal-delay-card-1]="i === 0"
        [class.reveal-delay-card-2]="i === 1"
        [class.reveal-delay-card-3]="i === 2"
        [class.reveal-delay-card-4]="i === 3"
      >
        <span class="flex h-[38px] w-[38px] items-center justify-center rounded-[10px] bg-accent-bg text-accent-text">
          @switch (cap.icon) {
            @case ('saas') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8.2 12 4l8 4.2-8 4.2-8-4.2Z" />
                <path d="M4 12.4 12 16.6l8-4.2" />
                <path d="M4 16.2 12 20.4l8-4.2" />
              </svg>
            }
            @case ('ai') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.2" />
                <circle cx="5" cy="5.4" r="1.7" />
                <circle cx="19" cy="5.4" r="1.7" />
                <circle cx="5" cy="18.6" r="1.7" />
                <circle cx="19" cy="18.6" r="1.7" />
                <path d="M6.4 6.8 9.7 9.8M17.6 6.8l-3.3 3M6.4 17.2l3.3-3M17.6 17.2l-3.3-3" />
              </svg>
            }
            @case ('automation') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 12a8 8 0 1 1-2.4-5.7" />
                <path d="M20 3.6V7h-3.4" />
                <circle cx="12" cy="12" r="2.6" />
              </svg>
            }
            @case ('cloud') {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7.3 18.6h9.4a4 4 0 0 0 .5-7.97 5.6 5.6 0 0 0-10.7-1.2A3.9 3.9 0 0 0 7.3 18.6Z" />
                <path d="M12 15.4v-4.2M10 13.2l2-2 2 2" />
              </svg>
            }
          }
        </span>
        <h3 class="font-display text-[17px] font-medium tracking-[-0.01em] sm:text-lg">{{ cap.title }}</h3>
        <p class="text-[14px] leading-[1.6] text-text-muted sm:text-[14.5px]">{{ cap.desc }}</p>
      </article>
    }
  </div>
</section>
