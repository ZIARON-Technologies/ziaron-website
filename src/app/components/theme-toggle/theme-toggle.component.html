<div class="flex items-center gap-0.5 rounded-full border border-border p-0.5" role="group" aria-label="Tema de la página">
  <button
    type="button"
    (click)="setTheme('light')"
    [attr.aria-pressed]="themeService.theme() === 'light'"
    class="flex h-7 w-7 items-center justify-center rounded-full outline-none transition focus-visible:ring-2 focus-visible:ring-accent"
    [class]="themeService.theme() === 'light' ? 'bg-accent text-bg' : 'text-text-muted hover:text-text'"
    aria-label="Tema claro"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
  <button
    type="button"
    (click)="setTheme('auto')"
    [attr.aria-pressed]="themeService.theme() === 'auto'"
    class="flex h-7 w-7 items-center justify-center rounded-full outline-none transition focus-visible:ring-2 focus-visible:ring-accent"
    [class]="themeService.theme() === 'auto' ? 'bg-accent text-bg' : 'text-text-muted hover:text-text'"
    aria-label="Tema automático (según el sistema)"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="13" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </svg>
  </button>
  <button
    type="button"
    (click)="setTheme('dark')"
    [attr.aria-pressed]="themeService.theme() === 'dark'"
    class="flex h-7 w-7 items-center justify-center rounded-full outline-none transition focus-visible:ring-2 focus-visible:ring-accent"
    [class]="themeService.theme() === 'dark' ? 'bg-accent text-bg' : 'text-text-muted hover:text-text'"
    aria-label="Tema oscuro"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
    </svg>
  </button>
</div>
