<section id="valores" class="flex w-full scroll-mt-[88px] sm:scroll-mt-[104px] lg:scroll-mt-[112px] flex-col gap-[14px] sm:gap-[26px]">
  <div appReveal class="reveal-delay-1 border-b border-line pb-[14px] sm:pb-[18px]">
    <h2 class="font-display text-[22px] font-medium tracking-[-0.015em] sm:text-2xl">Valores</h2>
  </div>

  <div class="grid grid-cols-1 gap-x-6 gap-y-3 sm:grid-cols-2 lg:grid-cols-3">
    @for (principle of principles; track principle.n; let i = $index) {
      <div
        appReveal
        class="flex items-baseline gap-3"
        [class.reveal-delay-card-1]="i % 4 === 0"
        [class.reveal-delay-card-2]="i % 4 === 1"
        [class.reveal-delay-card-3]="i % 4 === 2"
        [class.reveal-delay-card-4]="i % 4 === 3"
      >
        <span class="font-mono text-[11px] text-text-dim">{{ principle.n }}</span>
        <span class="font-display text-[15.5px] font-medium tracking-[-0.01em]">{{ principle.title }}</span>
      </div>
    }
  </div>
</section>
