<div class="w-full overflow-hidden rounded-2xl border border-border bg-bg-elevated transition-colors duration-200" style="box-shadow: var(--shadow-panel)">
  <div class="flex items-center justify-between gap-3 border-b border-line px-[18px] py-[13px]">
    <div class="flex flex-none items-center gap-1.5">
      <span class="block h-[7px] w-[7px] rounded-full" style="background: #8B5CF6"></span>
      <span class="block h-[7px] w-[7px] rounded-full" style="background: #4F7FFF"></span>
      <span class="block h-[7px] w-[7px] rounded-full bg-accent"></span>
    </div>
    <span class="flex-1 truncate text-center font-mono text-[9.5px] tracking-[0.09em] text-text-dim sm:text-[11px]">ziaron://estado-del-sistema</span>
    <span class="flex-none font-mono text-[11px] text-text-dim">v0.1</span>
  </div>

  <!-- `compact` (usado en el hero): isotipo arriba y terminal abajo en todos
       los tamaños, porque el panel ocupa solo una columna. Sin `compact`:
       dos columnas en desktop (layout original del handoff). -->
  <div [class]="compact() ? 'grid grid-cols-1' : 'grid grid-cols-1 lg:grid-cols-[minmax(0,0.9fr)_minmax(0,1.1fr)]'">
    <div class="relative border-b border-line pt-2.5" [class.nexus-split]="!compact()" style="background: radial-gradient(120% 130% at 50% 45%, rgba(79, 127, 255, 0.09), transparent 70%)">
      <svg
        width="100%"
        height="150"
        viewBox="150 0 240 186"
        preserveAspectRatio="xMidYMid meet"
        class="block h-[150px] sm:h-[170px] lg:h-[196px]"
      >
        <defs>
          <linearGradient id="nexus-z-light" x1="214" y1="41" x2="326" y2="145" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" />
            <stop offset="0.35" stop-color="#6366F1" />
            <stop offset="0.65" stop-color="#4F7FFF" />
            <stop offset="1" stop-color="#0E7490" />
          </linearGradient>
          <linearGradient id="nexus-z-dark" x1="214" y1="41" x2="326" y2="145" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" />
            <stop offset="0.35" stop-color="#6366F1" />
            <stop offset="0.65" stop-color="#4F7FFF" />
            <stop offset="1" stop-color="#06B6D4" />
          </linearGradient>
          <radialGradient id="nexus-core-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 93) scale(15)">
            <stop stop-color="#22D3EE" />
            <stop offset="0.5" stop-color="#4F7FFF" />
            <stop offset="1" stop-color="#6366F1" />
          </radialGradient>
          <radialGradient id="nexus-core-dark" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 93) scale(15)">
            <stop stop-color="white" />
            <stop offset="0.35" stop-color="#22D3EE" />
            <stop offset="0.75" stop-color="#4F7FFF" />
            <stop offset="1" stop-color="#6366F1" />
          </radialGradient>
        </defs>

        <!-- La Z: mismo trazo que el isotipo de marca, geometría 1:1 obligatoria
             (4 nodos en cuadrado de 112×112). stroke-width 14.7 mantiene la
             MISMA proporción trazo/cuadrado que el isotipo maestro (21.8414
             sobre un cuadrado de 166.1843 = 13.14%; 112 × 0.1314 ≈ 14.7) —
             el handoff original traía 8, que se veía desproporcionadamente
             delgado comparado con el resto del sistema de marca. Estático
             acá; el loader (ver app/components/loader) reutiliza esta misma
             geometría animada. -->
        <path [attr.stroke]="'url(#' + zGradientId() + ')'" d="M214 37 H326 L214 149 H326" fill="none" stroke-width="14.7" stroke-linecap="round" stroke-linejoin="round" />

        <path d="M214 37 L270 93 L326 149 M326 37 L270 93 L214 149" stroke="#4F7FFF" stroke-width="1" stroke-dasharray="3 6" opacity="0.35" />
        <path d="M170 93 H214 M326 93 H370 M270 15 V37 M270 149 V171" stroke="#4F7FFF" stroke-width="1" stroke-dasharray="2 7" opacity="0.28" />

        <!-- Nodos: mismas proporciones que el isotipo maestro respecto al
             disco (halo ≈ 1.73×, hueco = disco/2, punto central = disco/5) —
             recalculadas tras subir el stroke de la Z a 14.7 (antes el disco
             de 7.5 quedaba casi tapado por un trazo de ese grosor). -->

        <!-- Nodo 1 (esquina superior izquierda) -->
        <circle cx="214" cy="37" r="24.4" fill="#8B5CF6" [attr.opacity]="nodeHaloOpacity()" />
        <circle cx="214" cy="37" r="14.1" fill="#8B5CF6" />
        <circle cx="214" cy="37" r="7.05" style="fill: var(--bg-elevated)" />
        <circle cx="214" cy="37" r="2.82" fill="#8B5CF6" />

        <!-- Nodo 2 (esquina superior derecha) -->
        <circle cx="326" cy="37" r="24.4" fill="#6366F1" [attr.opacity]="nodeHaloOpacity()" />
        <circle cx="326" cy="37" r="14.1" fill="#6366F1" />
        <circle cx="326" cy="37" r="7.05" style="fill: var(--bg-elevated)" />
        <circle cx="326" cy="37" r="2.82" fill="#6366F1" />

        <!-- Nodo 3 (esquina inferior izquierda) -->
        <circle cx="214" cy="149" r="24.4" fill="#4F7FFF" [attr.opacity]="nodeHaloOpacity()" />
        <circle cx="214" cy="149" r="14.1" fill="#4F7FFF" />
        <circle cx="214" cy="149" r="7.05" style="fill: var(--bg-elevated)" />
        <circle cx="214" cy="149" r="2.82" fill="#4F7FFF" />

        <!-- Nodo 4 (esquina inferior derecha) — único que cambia de color por tema -->
        <circle cx="326" cy="149" r="24.4" [attr.fill]="node4Color()" [attr.opacity]="node4HaloOpacity()" />
        <circle cx="326" cy="149" r="14.1" [attr.fill]="node4Color()" />
        <circle cx="326" cy="149" r="7.05" style="fill: var(--bg-elevated)" />
        <circle cx="326" cy="149" r="2.82" [attr.fill]="node4Color()" />

        <!-- Núcleo: mismas proporciones que el isotipo maestro / loader,
             escaladas al cuadrado de 112px de este panel (factor 112 ÷
             166.1843 ≈ 0.674 respecto al isotipo maestro de 166.1843px).
             El halo de opacidad tenue (r=22.2) es un agregado propio del
             panel para dar profundidad — el isotipo maestro no lo tiene —
             pero mantiene la misma proporción halo/anillo que los nodos
             (~1.73×) para quedar visualmente coherente. -->
        <circle cx="270" cy="93" r="22.2" fill="#4F7FFF" opacity="0.07" />
        <circle cx="270" cy="93" r="12.8" style="fill: var(--bg-elevated)" stroke="#6366F1" stroke-width="1.28" />
        <circle cx="270" cy="93" r="8.32" [attr.fill]="'url(#' + coreGradientId() + ')'" />
        <circle cx="270" cy="93" r="1.6" fill="white" />
      </svg>
      <span class="block px-[22px] pb-[14px] pt-1 font-mono text-[9.5px] tracking-[0.1em] text-text-dim sm:pb-[18px] sm:text-[10.5px]">NEXUS · NÚCLEO DE PLATAFORMA</span>
    </div>

    <div class="px-[22px] pb-5 pt-2.5 font-mono text-[11.5px] leading-[1.9] sm:pb-6 lg:text-[12.5px]">
      <div class="mb-2 text-text-dim"><span class="text-accent-text">$</span> ziaron status --ecosystem</div>
      <div class="grid grid-cols-[auto_1fr_auto] items-center gap-x-3 sm:gap-x-4">
        @for (product of ecosystem; track product.id) {
          <span [class]="product.status === 'building' ? 'text-accent-text' : 'text-text-dim/60'">{{ product.status === 'building' ? '●' : '○' }}</span>
          <span [class]="product.status === 'building' ? 'text-text' : 'text-text-muted'">{{ product.name }}</span>
          <span [class]="product.status === 'building' ? 'text-accent-text' : 'text-text-dim'">{{ statusLabel(product.status) }}</span>
        }
      </div>
    </div>
  </div>
</div>
