<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var stored = localStorage.getItem('ziaron-theme') || 'auto';
      var isDark = stored === 'dark' || (stored === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>
  <title>ZIARON — Diseñamos plataformas inteligentes</title>
  <meta name="description" content="ZIARON Technologies. Ingeniería de plataformas SaaS, inteligencia artificial, automatización e infraestructura cloud.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="h-screen w-full overflow-hidden bg-bg font-body text-text antialiased transition-colors">
  <app-root class="block h-full w-full"></app-root>
</body>
</html>
